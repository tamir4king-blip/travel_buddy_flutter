name: travel_buddy_mobile
description: "A gamified travel companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^15.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.9.0

  # Maps & Location
  mapbox_maps_flutter: ^2.18.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI & Theming
  google_fonts: 8.0.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16

  # Icons
  lucide_icons: ^0.257.0

  # Charts
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Background Service & Permissions
  flutter_background_service: ^5.0.5
  permission_handler: ^11.3.1

  # Error Monitoring
  sentry_flutter: ^9.14.0

  # Utilities
  intl: 0.20.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.0
  path: ^1.9.0
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  uuid: ^4.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
